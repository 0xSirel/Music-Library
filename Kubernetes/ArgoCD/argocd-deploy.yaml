apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: music-library
  namespace: argocd
spec:
  project: music-library

  source:
    repoURL: https://github.com/0xSirel/Music-Library
    targetRevision: main
    path: Kubernetes/music-library-chart

  destination:
    server: https://kubernetes.default.svc
    namespace: music-library

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
